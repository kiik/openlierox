name: Build Windows

on:
  # PRs build only Linux and WASM to keep CI light. Windows builds on develop
  # pushes and on demand via workflow_dispatch, so a dev can run it on a
  # branch when they need a Windows artifact.
  push:
    branches: [develop]
  workflow_dispatch:
  # Reusable: invoked by release-beta.yml on merges to master.
  workflow_call:

jobs:
  build-windows:
    name: Build Windows .exe (MSYS2 MinGW64)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libgd
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-openal
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-yaml-cpp
            mingw-w64-x86_64-ntldd-git
            zip

      - name: Build
        run: ./.github/workflows/build-windows.sh

      - name: Package
        run: ./.github/workflows/package-windows.sh

      # Upload the bundle directory itself, not a zip we made. actions/upload-artifact
      # always zips the artifact when it's downloaded, so handing it a zip produces
      # a zip-inside-a-zip (the download nests openlierox-*-windows three folders
      # deep). Uploading the plain directory gives a single openlierox-<ver>-windows.zip
      # containing the bundle folder. Unlike the mac/linux bundles there is no
      # executable bit to preserve on Windows, so no self-zip is needed. The release
      # job (master-build.yaml) zips any directory artifact into the release asset,
      # so it still gets one ready-to-publish archive.
      - name: Detect bundle name
        id: bundle
        run: echo "name=$(basename distrib/openlierox-*-windows)" >> "$GITHUB_OUTPUT"

      - name: Upload openlierox-windows
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: distrib
          if-no-files-found: error
